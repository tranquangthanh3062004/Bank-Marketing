[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-marketing"
version = "1.1.0"
description = "Enterprise Bank Marketing Lead Scoring & AI Lakehouse Engine with Dual-Model Architecture"
authors = [
  { name = "Tran Quang Thanh", email = "tranquangthanh3062004@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  # Core Data Science & Math
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scipy>=1.10.0",
  "pyarrow>=14.0.0",

  # Lakehouse & SQL Engine
  "duckdb>=1.1.0",

  # Data Contracts & Schemas
  "pandera>=0.20.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.0.0",
  "pyyaml>=6.0.0",

  # Machine Learning & AI
  "scikit-learn>=1.3.0",
  "imbalanced-learn>=0.11.0",
  "lightgbm>=4.0.0",
  "shap>=0.42.0",
  "joblib>=1.3.0",

  # Serving & API
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
  "python-multipart>=0.0.9",
  "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "jupyterlab>=4.0.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "black>=23.0.0",
  "flake8>=6.0.0",
]

[project.scripts]
bank-marketing = "data_engineer.src.cli:main"
bm-cli = "data_engineer.src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["data_engineer*", "src*"]
