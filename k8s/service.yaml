apiVersion: v1
kind: Service
metadata:
  name: bank-marketing-service
  namespace: default
  labels:
    app: bank-marketing-serving
spec:
  type: ClusterIP
  selector:
    app: bank-marketing-serving
  ports:
    - port: 80
      targetPort: 8000
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bank-marketing-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bank-marketing-serving
  minReplicas: 2
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
