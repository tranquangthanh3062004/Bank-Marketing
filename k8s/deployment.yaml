apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-marketing-serving
  namespace: default
  labels:
    app.kubernetes.io/name: bank-marketing-serving
    app.kubernetes.io/part-of: bank-marketing-ai-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bank-marketing-serving
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bank-marketing-serving
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: lead-scoring-api
          image: bank-marketing-serving:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: bank-marketing-config
            - secretRef:
                name: bank-marketing-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
